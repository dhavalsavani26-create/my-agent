[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-browser-agent"
version = "0.1.0"
description = "A Python Playwright autonomous browser agent with planning, memory, tools, and browser control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.44.0"]

[project.scripts]
browser-agent = "browser_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
